[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "kaggle-driver"
description = "Scaffolding for Kaggle competition workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Priebe", email = "christophermpriebe@gmail.com" },
]
keywords = ["kaggle", "machine-learning", "competition", "scaffolding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "immutabledict>=4",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.6"]
pandas = ["pandas>=2.0"]
sklearn = ["scikit-learn>=1.3", "joblib>=1.3"]
torch = ["torch>=2.1"]
all = [
    "kaggle>=1.6",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "torch>=2.1",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pylint>=3.2",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = [
    "sphinx>=7",
    "sphinx-rtd-theme>=2",
    "sphinx-gallery>=0.16",
    "pillow>=10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "torch>=2.1",
]

[project.urls]
Homepage = "https://github.com/christopherpriebe/kaggle-driver"
Documentation = "https://kaggle-driver.readthedocs.io/"
Repository = "https://github.com/christopherpriebe/kaggle-driver"
Changelog = "https://kaggle-driver.readthedocs.io/en/latest/changelog.html"
Issues = "https://github.com/christopherpriebe/kaggle-driver/issues"

[tool.hatch.version]
path = "src/kaggle_driver/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kaggle_driver"]

[tool.hatch.build.targets.sdist]
include = [
    "src/kaggle_driver",
    "tests",
    "docs",
    "examples",
    "README.md",
    "CHANGELOG.rst",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["docs/_build", ".venv"]

[tool.ruff.lint]
select = [
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "D",   # pydocstyle
    "DTZ", # flake8-datetimez
    "E",   # pycodestyle errors
    "EXE", # flake8-executable
    "F",   # pyflakes
    "I",   # isort
    "INT", # flake8-gettext
    "N",   # pep8-naming
    "PIE", # flake8-pie
    "PL",  # pylint subset
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "Q",   # flake8-quotes
    "RSE", # flake8-raise
    "RUF", # ruff-specific rules
    "S",   # flake8-bandit
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D107",    # docstrings on __init__ live on the class
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "RUF001",  # ambiguous unicode character in string
    "S101",    # assert is fine in tests
    "PLR0913", # too many arguments; handled by pylint
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S", "PLR2004"]
"examples/**" = ["D", "S"]
"docs/conf.py" = ["D", "INP001"]

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false
mark-parentheses = false

[tool.ruff.lint.isort]
known-first-party = ["kaggle_driver"]
force-single-line = false

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pylint.main]
ignore = [".venv", "build", "dist", "docs/_build"]
jobs = 0
py-version = "3.10"

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
    "duplicate-code",
    "import-outside-toplevel",
    "missing-class-docstring",
    "missing-function-docstring",
    "missing-module-docstring",
    "fixme",
    "line-too-long",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.design]
max-args = 8
max-attributes = 12
max-locals = 20

[tool.pylint.basic]
good-names = ["i", "j", "k", "n", "m", "x", "y", "X", "_"]

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
packages = ["kaggle_driver"]
strict = true
warn_unreachable = true
show_error_codes = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = [
    "kaggle",
    "kaggle.*",
    "sklearn",
    "sklearn.*",
    "joblib",
    "torch",
    "torch.*",
    "yaml",
    "pandas",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "integration: end-to-end pipelines on synthetic data",
    "slow: takes more than one second to run",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:torch.*",
    "ignore::PendingDeprecationWarning:torch.*",
    "ignore::DeprecationWarning:sklearn.*",
    "ignore::FutureWarning:sklearn.*",
]

[tool.coverage.run]
source = ["src/kaggle_driver"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abc.abstractmethod",
    "@(typing\\.)?overload",
]
