name: build
on:
  push:
    branches: [master, main, dev]
    tags: ["v*"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy src/kaggle_driver
      - name: pylint
        run: uv run pylint src/kaggle_driver
      - name: no em dashes
        run: ./scripts/check_no_em_dashes.sh

  test-unit:
    needs: lint
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Pin Python ${{ matrix.python }}
        run: uv python pin ${{ matrix.python }}
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Unit tests
        run: uv run pytest -m "not integration and not slow" --cov --cov-report=xml
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  test-integration:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Pin Python 3.12
        run: uv python pin 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Integration and slow tests
        run: uv run pytest -m "integration or slow"

  docs:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - name: Pin Python 3.12
        run: uv python pin 3.12
      - name: Install docs dependencies
        run: uv sync --extra docs --dev
      - name: Build docs
        run: uv run sphinx-build -W -E -b html docs docs/_build/html

  release:
    needs: [lint, test-unit, test-integration, docs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/kaggle-driver
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Build distribution
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
